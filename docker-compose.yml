version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: kiosk_mongodb
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    restart: always

  redis:
    image: redis:alpine
    container_name: kiosk_redis
    ports:
      - "6380:6379"
    restart: always

  minio:
    image: minio/minio:latest
    container_name: kiosk_minio
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: always

volumes:
  mongodb_data:
  minio_data:
